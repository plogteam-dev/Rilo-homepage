<!DOCTYPE html>
<html lang="ko">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="../../dist/styles.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; color-scheme: light dark; }
        .prose p { margin-bottom: 1.25em; }

        .notice-list li { display: flex; justify-content: space-between; align-items: baseline; }

<body class="bg-[#F8F8F8] dark:bg-[#161616] text-gray-900 dark:text-white min-h-screen flex flex-col" style="background-image: none !important;">
    <main class="flex-1 w-full max-w-6xl mx-auto py-12 px-4 flex flex-col items-start">

                <ul class="notice-list list-none pl-0 divide-y divide-gray-300 dark:divide-gray-800">

        </div>
    </footer>
    <script>
        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                if (params.get('webview') === '1') {
                    var style = document.createElement('style');
                    style.type = 'text/css';
                    style.innerHTML = 'main > h1:first-of-type, footer { display: none !important; }';
                    document.head.appendChild(style);
                }
            } catch (e) {}
        })();
