<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RILO 公告 - 「地图」标签页开放啦。">
    <title>公告 - 「地图」标签页开放啦。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../../../dist/styles.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; color-scheme: light dark; }
        .prose p { margin-bottom: 1.25em; white-space: pre-line; }
        .prose h2 { margin-top: 1.25em; margin-bottom: 0.5em; font-size: 1.5em; font-weight: 700; }
        .prose time { color: #6B7280; font-size: 0.9em; }
        @media (prefers-color-scheme: dark) {
            .prose time { color: #9CA3AF; }
        }
        body { font-family: 'Poppins', sans-serif; }
    </style>

    <meta name="robots" content="noindex">
</head>
<body class="bg-[#F8F8F8] dark:bg-[#161616] text-gray-900 dark:text-white min-h-screen flex flex-col" style="background-image: none !important;">
    <main class="flex-1 w-full max-w-6xl mx-auto py-12 px-4 flex flex-col items-start">
        <h1 class="text-4xl font-bold mb-6 text-gray-900 dark:text-white m-0">「地图」标签页开放啦。</h1>

        <section class="bg-[#F8F8F8] dark:bg-[#161616] text-gray-900 dark:text-white rounded-lg p-8 w-full">
            <div class="prose max-w-none text-gray-700 dark:text-gray-200">
                <p>在地图标签页中，你可以在地图上一目了然地浏览其他人留下的地点和你记录过的地点。

在「所有地点」和「我的记录」之间切换，
看看这个区域现在积累了哪些地点，以及你的一天沿着怎样的路线展开。

另外，设为好友可见的日志
在地图上也只对与你结为好友的人显示。

希望你能以地点为中心重新回顾一天的记录，
无论是熟悉的街区还是旅途中的瞬间，都能回味得更加特别。

RILO将让由地点串联起来的你的一天被记得更久，
并自然地连接起那些瞬间。

RILO团队敬上</p>

            </div>
        </section>
    </main>
    <footer class="py-8 px-4 bg-[#F8F8F8] dark:bg-[#161616] border-t border-gray-300 dark:border-gray-800">
        <div class="max-w-6xl mx-auto text-center text-gray-500 dark:text-gray-400">
            <p>&copy; 2025 RILO. All rights reserved.</p>
        </div>
    </footer>
    <script>
        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                if (params.get('webview') === '1') {
                    var style = document.createElement('style');
                    style.type = 'text/css';
                    style.innerHTML = 'main > h1:first-of-type, footer { display: none !important; } main { padding-top: 0.5rem !important; }';
                    document.head.appendChild(style);
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
