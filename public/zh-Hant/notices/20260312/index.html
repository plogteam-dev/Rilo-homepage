<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RILO 公告事項 - 「地圖分頁」開放了。">
    <title>公告事項 - 「地圖分頁」開放了。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../../../dist/styles.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; color-scheme: light dark; }
        .prose p { margin-bottom: 1.25em; white-space: pre-line; }
        .prose h2 { margin-top: 1.25em; margin-bottom: 0.5em; font-size: 1.5em; font-weight: 700; }
        .prose time { color: #6B7280; font-size: 0.9em; }
        @media (prefers-color-scheme: dark) {
            .prose time { color: #9CA3AF; }
        }
        body { font-family: 'Poppins', sans-serif; }
    </style>

    <meta name="robots" content="noindex">
</head>
<body class="bg-[#F8F8F8] dark:bg-[#161616] text-gray-900 dark:text-white min-h-screen flex flex-col" style="background-image: none !important;">
    <main class="flex-1 w-full max-w-6xl mx-auto py-12 px-4 flex flex-col items-start">
        <h1 class="text-4xl font-bold mb-6 text-gray-900 dark:text-white m-0">「地圖分頁」開放了。</h1>

        <section class="bg-[#F8F8F8] dark:bg-[#161616] text-gray-900 dark:text-white rounded-lg p-8 w-full">
            <div class="prose max-w-none text-gray-700 dark:text-gray-200">
                <p>在地圖分頁中，可以在地圖上一覽其他人留下的地點與自己記錄的地點。

在「所有地點」與「我的紀錄」之間切換，
看看這個地區累積了哪些地點，以及自己的一天是沿著什麼路線串連起來的。

另外，設為好友公開的日誌，
在地圖上也只會顯示給與你結為好友的人。

希望透過以地點為中心重溫一天的紀錄，
無論是熟悉的街區還是旅途中的瞬間，都能更特別地回顧。

RILO會讓地點串連起的你的一天被記得更久，
並自然地將那些瞬間串連起來。

RILO團隊 敬上</p>


            </div>
        </section>
    </main>
    <footer class="py-8 px-4 bg-[#F8F8F8] dark:bg-[#161616] border-t border-gray-300 dark:border-gray-800">
        <div class="max-w-6xl mx-auto text-center text-gray-500 dark:text-gray-400">
            <p>&copy; 2025 RILO. All rights reserved.</p>
        </div>
    </footer>
    <script>
        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                if (params.get('webview') === '1') {
                    var style = document.createElement('style');
                    style.type = 'text/css';
                    style.innerHTML = 'main > h1:first-of-type, footer { display: none !important; } main { padding-top: 0.5rem !important; }';
                    document.head.appendChild(style);
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
