<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RILO - Remember It, Log It!</title>

    <!-- OG Meta Tags -->
    <meta property="og:title" content="RILO - Remember It, Log It!" />
    <meta property="og:description" content="사진으로 쉽고 편하게 기록하는 나의 하루. 지금 App Store에서 무료로 다운로드하세요." />
    <meta property="og:image" content="https://www.rilo.life/images/RILO_Logo_TYPO.png" />
    <meta property="og:url" content="https://www.rilo.life/app" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #1F1F1F;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        text-align: center;
        padding: 40px 24px;
        max-width: 420px;
        width: 100%;
      }

      .logo {
        height: 2.5rem;
        margin-bottom: 12px;
      }

      .tagline {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 300;
        margin-bottom: 40px;
      }

      .description {
        font-size: 16px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 300;
        margin-bottom: 36px;
      }

      .store-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px 32px;
        background: #ffffff;
        color: #1F1F1F;
        text-decoration: none;
        font-weight: 600;
        font-size: 17px;
        border-radius: 50px;
        transition: transform 0.2s, box-shadow 0.2s;
        width: 100%;
        max-width: 300px;
      }

      .store-btn:active {
        transform: scale(0.97);
      }

      .store-btn svg {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }

      .status-msg {
        margin-top: 24px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 300;
        line-height: 1.5;
      }

      .status-msg.redirecting {
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/images/RILO_Logo_TYPO.png" alt="RILO" class="logo" />
      <p class="tagline">Remember It, Log It!</p>

      <p class="description">
        사진으로 쉽고 편하게 기록하는 나의 하루.<br />
        일상의 순간을 쉽고 예쁘게 남겨보세요.
      </p>

      <a
        id="storeBtn"
        class="store-btn"
        href="https://apps.apple.com/kr/app/rilo/id6748411212"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.08 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        App Store에서 다운로드
      </a>

      <p id="statusMsg" class="status-msg"></p>
    </div>

    <script>
      (function () {
        var storeURL = "https://apps.apple.com/kr/app/rilo/id6748411212";
        var statusMsg = document.getElementById("statusMsg");
        var ua = navigator.userAgent || "";

        var isIOS = /iPhone|iPad|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS) {
          statusMsg.textContent = "App Store로 이동 중...";
          statusMsg.classList.add("redirecting");

          setTimeout(function () {
            window.location.href = storeURL;
          }, 1200);
        } else {
          statusMsg.textContent = "현재 iOS에서만 사용 가능합니다.";
        }
      })();
    </script>
  </body>
</html>
