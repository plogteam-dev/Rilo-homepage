<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RILO - Remember It, Log It!</title>

    <!-- OG Meta Tags -->
    <meta property="og:title" content="RILO - Remember It, Log It!" />
    <meta property="og:description" content="Capture your day with photos, simply. 사진으로 쉽고 편하게 기록하는 나의 하루." />
    <meta property="og:image" content="https://www.rilo.life/images/RILO_Logo_TYPO.png" />
    <meta property="og:url" content="https://www.rilo.life/app" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #1F1F1F;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        text-align: center;
        padding: 40px 24px;
        max-width: 420px;
        width: 100%;
      }

      .logo {
        height: 2.5rem;
        margin-bottom: 12px;
      }

      .tagline {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 300;
        margin-bottom: 40px;
      }

      .description {
        font-size: 16px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 300;
        margin-bottom: 36px;
      }

      .store-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px 32px;
        background: #ffffff;
        color: #1F1F1F;
        text-decoration: none;
        font-weight: 600;
        font-size: 17px;
        border-radius: 50px;
        transition: transform 0.2s, box-shadow 0.2s;
        width: 100%;
        max-width: 300px;
      }

      .store-btn:active {
        transform: scale(0.97);
      }

      .store-btn svg {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }

      .status-msg {
        margin-top: 24px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 300;
        line-height: 1.5;
      }

      .status-msg.redirecting {
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/images/RILO_Logo_TYPO.png" alt="RILO" class="logo" />
      <p class="tagline">Remember It, Log It!</p>

      <p id="description" class="description">
        사진으로 쉽고 편하게 기록하는 나의 하루.<br />
        일상의 순간을 쉽고 예쁘게 남겨보세요.
      </p>

      <a
        id="storeBtn"
        class="store-btn"
        href="https://apps.apple.com/app/id6748411212"
      >
        <svg id="storeIconApple" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.08 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        <svg id="storeIconGoogle" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <path d="M3.6 2.3c-.3.3-.4.7-.4 1.2v17c0 .5.1.9.4 1.2l.1.1 9.5-9.5v-.2L3.7 2.2l-.1.1z"/>
          <path d="M16.4 15.5l-3.2-3.2v-.2l3.2-3.2.1.1 3.8 2.1c1.1.6 1.1 1.6 0 2.2l-3.8 2.1-.1.1z"/>
          <path d="M16.5 15.4L13.2 12 3.6 21.7c.4.4.9.4 1.6 0l11.3-6.3"/>
          <path d="M16.5 8.6L5.2 2.3c-.7-.4-1.2-.3-1.6 0L13.2 12l3.3-3.4z"/>
        </svg>
        <span id="storeLabel">App Store에서 다운로드</span>
      </a>

      <p id="statusMsg" class="status-msg"></p>
    </div>

    <script>
      (function () {
        // Localized copy. English is the fallback for any unsupported language.
        var STRINGS = {
          en: {
            description: "Capture your day with photos, simply.<br />Keep everyday moments, beautifully.",
            storeApple: "Download on the App Store",
            storeGoogle: "Get it on Google Play",
            redirectingApple: "Redirecting to the App Store...",
            redirectingGoogle: "Redirecting to Google Play...",
            desktop: "Available on iOS and Android."
          },
          ko: {
            description: "사진으로 쉽고 편하게 기록하는 나의 하루.<br />일상의 순간을 쉽고 예쁘게 남겨보세요.",
            storeApple: "App Store에서 다운로드",
            storeGoogle: "Google Play에서 다운로드",
            redirectingApple: "App Store로 이동 중...",
            redirectingGoogle: "Google Play로 이동 중...",
            desktop: "iOS와 Android에서 사용할 수 있습니다."
          },
          ja: {
            description: "写真でかんたんに残す、わたしの一日。<br />日常の瞬間をきれいに記録しましょう。",
            storeApple: "App Storeでダウンロード",
            storeGoogle: "Google Playで手に入れよう",
            redirectingApple: "App Storeに移動しています...",
            redirectingGoogle: "Google Playに移動しています...",
            desktop: "iOSとAndroidで利用できます。"
          },
          "zh-Hans": {
            description: "用照片轻松记录我的一天。<br />把日常的瞬间简单又美好地留下来。",
            storeApple: "在 App Store 下载",
            storeGoogle: "在 Google Play 下载",
            redirectingApple: "正在前往 App Store...",
            redirectingGoogle: "正在前往 Google Play...",
            desktop: "支持 iOS 和 Android。"
          },
          "zh-Hant": {
            description: "用照片輕鬆記錄我的一天。<br />把日常的瞬間簡單又美好地留下來。",
            storeApple: "在 App Store 下載",
            storeGoogle: "在 Google Play 下載",
            redirectingApple: "正在前往 App Store...",
            redirectingGoogle: "正在前往 Google Play...",
            desktop: "支援 iOS 與 Android。"
          },
          vi: {
            description: "Ghi lại một ngày của bạn bằng ảnh, thật dễ dàng.<br />Lưu giữ những khoảnh khắc thường ngày thật đẹp.",
            storeApple: "Tải về trên App Store",
            storeGoogle: "Tải về trên Google Play",
            redirectingApple: "Đang chuyển đến App Store...",
            redirectingGoogle: "Đang chuyển đến Google Play...",
            desktop: "Có trên iOS và Android."
          },
          id: {
            description: "Abadikan harimu dengan foto, mudah dan praktis.<br />Simpan momen sehari-hari dengan indah.",
            storeApple: "Unduh di App Store",
            storeGoogle: "Dapatkan di Google Play",
            redirectingApple: "Mengalihkan ke App Store...",
            redirectingGoogle: "Mengalihkan ke Google Play...",
            desktop: "Tersedia di iOS dan Android."
          }
        };

        // Pick a supported language from the browser, defaulting to English.
        // Chinese is resolved by script (Hant for TW/HK/MO), legacy "in" maps to Indonesian.
        function resolveLang() {
          var candidates = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || "en"];
          for (var i = 0; i < candidates.length; i++) {
            var tag = (candidates[i] || "").toLowerCase().replace(/_/g, "-");
            if (tag.slice(0, 2) === "zh") {
              if (/(^|-)hans(-|$)/.test(tag)) return "zh-Hans";
              if (/(^|-)hant(-|$)/.test(tag) || /-(tw|hk|mo)(-|$)/.test(tag)) return "zh-Hant";
              return "zh-Hans";
            }
            if (tag === "in" || tag.slice(0, 3) === "in-") return "id";
            var code = tag.slice(0, 2);
            if (STRINGS[code]) return code;
          }
          return "en";
        }

        var lang = resolveLang();
        var t = STRINGS[lang];
        document.documentElement.setAttribute("lang", lang);

        // Region-neutral link: Apple redirects to the user's own storefront.
        var APP_STORE_URL = "https://apps.apple.com/app/id6748411212";
        var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=life.rilo.android";
        var statusMsg = document.getElementById("statusMsg");
        var storeBtn = document.getElementById("storeBtn");
        var storeIconApple = document.getElementById("storeIconApple");
        var storeIconGoogle = document.getElementById("storeIconGoogle");
        var storeLabel = document.getElementById("storeLabel");
        var ua = navigator.userAgent || "";

        var isIOS = /iPhone|iPad|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/i.test(ua);

        document.getElementById("description").innerHTML = t.description;
        storeLabel.textContent = t.storeApple;

        if (isAndroid) {
          storeBtn.href = PLAY_STORE_URL;
          storeLabel.textContent = t.storeGoogle;
          storeIconApple.style.display = "none";
          storeIconGoogle.style.display = "";
        }

        if (isIOS || isAndroid) {
          statusMsg.textContent = isAndroid ? t.redirectingGoogle : t.redirectingApple;
          statusMsg.classList.add("redirecting");

          setTimeout(function () {
            window.location.href = isAndroid ? PLAY_STORE_URL : APP_STORE_URL;
          }, 1000);
        } else {
          statusMsg.textContent = t.desktop;
        }
      })();
    </script>
  </body>
</html>
