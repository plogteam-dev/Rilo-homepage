<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RILO</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: #0b0b0b;
        color: #ffffff;
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
      }
      .title { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
      .sub { opacity: 0.8; margin: 0 0 16px; line-height: 1.4; }
      .btn {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 12px;
        background: #ffffff;
        color: #0b0b0b;
        text-decoration: none;
        font-weight: 700;
      }
      .muted { opacity: 0.6; margin-top: 12px; font-size: 13px; }
      .card { display: none; }
      .card.visible { display: block; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <p class="title" id="title">Opening RILO…</p>
      <p class="sub" id="subtitle">If the app is installed, it opens automatically.</p>
      <a class="btn" id="storeLink" href="https://apps.apple.com/app/id6748411212">Get RILO</a>
      <p class="muted" id="debug"></p>
    </div>

    <script>
      (function () {
        // Localized copy. English is the fallback for any unsupported language.
        // Titles / idLabels are keyed by section (profile / log / spot).
        var STRINGS = {
          en: {
            storeApple: "Get RILO on the App Store",
            storeGoogle: "Get RILO on Google Play",
            noIdTitle: "Get RILO",
            noIdSubApple: "Install the app to open this link. Redirecting to the App Store…",
            noIdSubGoogle: "Install the app to open this link. Redirecting to Google Play…",
            deepLinkSubApple: "If you don't have the app, you can get it on the App Store.",
            deepLinkSubGoogle: "If you don't have the app, you can get it on Google Play.",
            titles: { profile: "RILO Profile", log: "RILO Log", spot: "RILO Spot" },
            idLabels: { profile: "Profile ID: ", log: "Log ID: ", spot: "Spot ID: " }
          },
          ko: {
            storeApple: "App Store에서 RILO 받기",
            storeGoogle: "Google Play에서 RILO 받기",
            noIdTitle: "RILO 받기",
            noIdSubApple: "앱을 설치하면 이 링크를 열 수 있어요. App Store로 이동합니다…",
            noIdSubGoogle: "앱을 설치하면 이 링크를 열 수 있어요. Google Play로 이동합니다…",
            deepLinkSubApple: "앱이 설치되어 있지 않다면 App Store에서 받을 수 있어요.",
            deepLinkSubGoogle: "앱이 설치되어 있지 않다면 Google Play에서 받을 수 있어요.",
            titles: { profile: "RILO 프로필", log: "RILO 로그", spot: "RILO 스팟" },
            idLabels: { profile: "프로필 ID: ", log: "로그 ID: ", spot: "스팟 ID: " }
          },
          ja: {
            storeApple: "App StoreでRILOを入手",
            storeGoogle: "Google PlayでRILOを入手",
            noIdTitle: "RILOを入手",
            noIdSubApple: "アプリをインストールするとこのリンクを開けます。App Storeに移動します…",
            noIdSubGoogle: "アプリをインストールするとこのリンクを開けます。Google Playに移動します…",
            deepLinkSubApple: "アプリがインストールされていない場合は App Store で入手できます。",
            deepLinkSubGoogle: "アプリがインストールされていない場合は Google Play で入手できます。",
            titles: { profile: "RILOプロフィール", log: "RILOログ", spot: "RILOスポット" },
            idLabels: { profile: "プロフィールID: ", log: "ログID: ", spot: "スポットID: " }
          },
          "zh-Hans": {
            storeApple: "在 App Store 获取 RILO",
            storeGoogle: "在 Google Play 获取 RILO",
            noIdTitle: "获取 RILO",
            noIdSubApple: "安装 App 后即可打开此链接。正在前往 App Store…",
            noIdSubGoogle: "安装 App 后即可打开此链接。正在前往 Google Play…",
            deepLinkSubApple: "如果尚未安装 App，可以在 App Store 下载。",
            deepLinkSubGoogle: "如果尚未安装 App，可以在 Google Play 下载。",
            titles: { profile: "RILO 个人主页", log: "RILO 日志", spot: "RILO 地点" },
            idLabels: { profile: "个人主页 ID：", log: "日志 ID：", spot: "地点 ID：" }
          },
          "zh-Hant": {
            storeApple: "在 App Store 取得 RILO",
            storeGoogle: "在 Google Play 取得 RILO",
            noIdTitle: "取得 RILO",
            noIdSubApple: "安裝 App 後即可開啟此連結。正在前往 App Store…",
            noIdSubGoogle: "安裝 App 後即可開啟此連結。正在前往 Google Play…",
            deepLinkSubApple: "如果尚未安裝 App，可以在 App Store 下載。",
            deepLinkSubGoogle: "如果尚未安裝 App，可以在 Google Play 下載。",
            titles: { profile: "RILO 個人檔案", log: "RILO 日誌", spot: "RILO 地點" },
            idLabels: { profile: "個人檔案 ID：", log: "日誌 ID：", spot: "地點 ID：" }
          },
          vi: {
            storeApple: "Tải RILO trên App Store",
            storeGoogle: "Tải RILO trên Google Play",
            noIdTitle: "Tải RILO",
            noIdSubApple: "Hãy cài ứng dụng để mở liên kết này. Đang chuyển đến App Store…",
            noIdSubGoogle: "Hãy cài ứng dụng để mở liên kết này. Đang chuyển đến Google Play…",
            deepLinkSubApple: "Nếu bạn chưa có ứng dụng, bạn có thể tải trên App Store.",
            deepLinkSubGoogle: "Nếu bạn chưa có ứng dụng, bạn có thể tải trên Google Play.",
            titles: { profile: "Hồ sơ RILO", log: "Log RILO", spot: "Địa điểm RILO" },
            idLabels: { profile: "ID hồ sơ: ", log: "ID log: ", spot: "ID địa điểm: " }
          },
          id: {
            storeApple: "Dapatkan RILO di App Store",
            storeGoogle: "Dapatkan RILO di Google Play",
            noIdTitle: "Dapatkan RILO",
            noIdSubApple: "Instal aplikasinya untuk membuka tautan ini. Mengalihkan ke App Store…",
            noIdSubGoogle: "Instal aplikasinya untuk membuka tautan ini. Mengalihkan ke Google Play…",
            deepLinkSubApple: "Kalau kamu belum punya aplikasinya, kamu bisa mengunduhnya di App Store.",
            deepLinkSubGoogle: "Kalau kamu belum punya aplikasinya, kamu bisa mengunduhnya di Google Play.",
            titles: { profile: "Profil RILO", log: "Log RILO", spot: "Tempat RILO" },
            idLabels: { profile: "ID profil: ", log: "ID log: ", spot: "ID tempat: " }
          }
        };

        // Pick a supported language from the browser, defaulting to English.
        // Chinese is resolved by script (Hant for TW/HK/MO), legacy "in" maps to Indonesian.
        function resolveLang() {
          var candidates = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || "en"];
          for (var i = 0; i < candidates.length; i++) {
            var tag = (candidates[i] || "").toLowerCase().replace(/_/g, "-");
            if (tag.slice(0, 2) === "zh") {
              if (/(^|-)hans(-|$)/.test(tag)) return "zh-Hans";
              if (/(^|-)hant(-|$)/.test(tag) || /-(tw|hk|mo)(-|$)/.test(tag)) return "zh-Hant";
              return "zh-Hans";
            }
            if (tag === "in" || tag.slice(0, 3) === "in-") return "id";
            var code = tag.slice(0, 2);
            if (STRINGS[code]) return code;
          }
          return "en";
        }

        var lang = resolveLang();
        var t = STRINGS[lang];
        document.documentElement.setAttribute("lang", lang);

        var path = window.location.pathname || "";
        // Normalize and parse path segments
        // Examples:
        // - "/profile/123"  -> ["profile","123"]
        // - "/profile/"     -> ["profile"]
        // - "/profile"      -> ["profile"]
        // - "/"             -> []
        var segments = path.split("/").filter(Boolean);
        var section = segments[0] || "";
        var itemId = segments[1] || "";

        var isProfile = section === "profile";
        var isLog = section === "log";
        var isSpot = section === "spot";

        if (!isProfile && !isLog && !isSpot) {
          window.location.replace("/");
          return;
        }

        // Platform detection. Android gets Google Play; everything else (iOS, desktop,
        // unknown) gets the region-neutral App Store link, which Apple redirects to the
        // user's storefront.
        var ua = navigator.userAgent || "";
        var isAndroid = /Android/i.test(ua);
        var ANDROID_PACKAGE = "life.rilo.android";
        var APP_STORE_URL = "https://apps.apple.com/app/id6748411212";
        var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE;
        var storeURL = isAndroid ? PLAY_STORE_URL : APP_STORE_URL;
        var storeLabel = isAndroid ? t.storeGoogle : t.storeApple;
        var noIdSub = isAndroid ? t.noIdSubGoogle : t.noIdSubApple;
        var deepLinkSub = isAndroid ? t.deepLinkSubGoogle : t.deepLinkSubApple;
        var title = document.getElementById("title");
        var subtitle = document.getElementById("subtitle");
        var debug = document.getElementById("debug");

        var customSchemeURL = "";
        var storeLink = document.getElementById("storeLink");
        if (storeLink) {
          storeLink.href = storeURL;
          storeLink.textContent = storeLabel;
        }

        // If there's no ID, we can't deep-link to a specific resource.
        // Guide the user to the App Store (with a visible fallback UI).
        if (!itemId) {
          title.textContent = t.noIdTitle;
          subtitle.textContent = noIdSub;
          debug.textContent = "";

          var cardNoId = document.getElementById("card");
          if (cardNoId) cardNoId.classList.add("visible");

          // Attempt to open the App Store directly (some in-app browsers may block redirects).
          setTimeout(function () {
            window.location.href = storeURL;
          }, 300);
          return;
        }

        // iOS / in-app browsers (e.g. KakaoTalk) try the custom scheme directly.
        // Android Chrome silently ignores unregistered schemes, so use the intent://
        // form instead: it opens the app if installed and otherwise falls through
        // to browser_fallback_url (Google Play) without an error page.
        // The query rides along: it refines what to open on the same path
        // (?open=music on a log, ?open=calendar&month= on a profile). On the
        // intent form it has to sit before the #Intent fragment.
        var query = window.location.search;
        if (isAndroid) {
          customSchemeURL =
            "intent://" + section + "/" + itemId + query +
            "#Intent;scheme=rilo;package=" + ANDROID_PACKAGE +
            ";S.browser_fallback_url=" + encodeURIComponent(PLAY_STORE_URL) + ";end";
        } else {
          customSchemeURL = "rilo://" + section + "/" + itemId + query;
        }
        title.textContent = t.titles[section];
        debug.textContent = itemId ? (t.idLabels[section] + itemId) : "";

        subtitle.textContent = deepLinkSub;

        var card = document.getElementById("card");
        var appOpened = false;

        // Detect if app opened (page loses visibility)
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            appOpened = true;
          }
        });
        window.addEventListener("blur", function () {
          appOpened = true;
        });

        // Try Custom URL Scheme first (for in-app browsers like KakaoTalk)
        if (customSchemeURL) {
          window.location.href = customSchemeURL;
        }

        // Show card if app doesn't open (don't auto-redirect)
        setTimeout(function () {
          if (!appOpened && !document.hidden) {
            card.classList.add("visible");
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
