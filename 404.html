<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RILO</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: #0b0b0b;
        color: #ffffff;
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
      }
      .title { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
      .sub { opacity: 0.8; margin: 0 0 16px; line-height: 1.4; }
      .btn {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 12px;
        background: #ffffff;
        color: #0b0b0b;
        text-decoration: none;
        font-weight: 700;
      }
      .muted { opacity: 0.6; margin-top: 12px; font-size: 13px; }
      .card { display: none; }
      .card.visible { display: block; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <p class="title" id="title">Opening RILO…</p>
      <p class="sub" id="subtitle">If the app is installed, it opens automatically.</p>
      <a class="btn" id="storeLink" href="https://apps.apple.com/app/id6748411212">Get RILO on the App Store</a>
      <p class="muted" id="debug"></p>
    </div>

    <script>
      (function () {
        // Localized copy. English is the fallback for any unsupported language.
        // Titles / idLabels are keyed by section (profile / log / spot).
        var STRINGS = {
          en: {
            store: "Get RILO on the App Store",
            noIdTitle: "Get RILO",
            noIdSub: "Install the app to open this link. Redirecting to the App Store…",
            deepLinkSub: "If you don't have the app, you can get it on the App Store.",
            titles: { profile: "RILO Profile", log: "RILO Log", spot: "RILO Spot" },
            idLabels: { profile: "Profile ID: ", log: "Log ID: ", spot: "Spot ID: " }
          },
          ko: {
            store: "App Store에서 RILO 받기",
            noIdTitle: "RILO 받기",
            noIdSub: "앱을 설치하면 이 링크를 열 수 있어요. App Store로 이동합니다…",
            deepLinkSub: "앱이 설치되어 있지 않다면 App Store에서 받을 수 있어요.",
            titles: { profile: "RILO 프로필", log: "RILO 로그", spot: "RILO 스팟" },
            idLabels: { profile: "프로필 ID: ", log: "로그 ID: ", spot: "스팟 ID: " }
          },
          ja: {
            store: "App StoreでRILOを入手",
            noIdTitle: "RILOを入手",
            noIdSub: "アプリをインストールするとこのリンクを開けます。App Storeに移動します…",
            deepLinkSub: "アプリがインストールされていない場合は App Store で入手できます。",
            titles: { profile: "RILOプロフィール", log: "RILOログ", spot: "RILOスポット" },
            idLabels: { profile: "プロフィールID: ", log: "ログID: ", spot: "スポットID: " }
          }
        };

        // Pick a supported language from the browser, defaulting to English.
        function resolveLang() {
          var candidates = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || "en"];
          for (var i = 0; i < candidates.length; i++) {
            var code = (candidates[i] || "").slice(0, 2).toLowerCase();
            if (STRINGS[code]) return code;
          }
          return "en";
        }

        var lang = resolveLang();
        var t = STRINGS[lang];
        document.documentElement.setAttribute("lang", lang);

        var path = window.location.pathname || "";
        // Normalize and parse path segments
        // Examples:
        // - "/profile/123"  -> ["profile","123"]
        // - "/profile/"     -> ["profile"]
        // - "/profile"      -> ["profile"]
        // - "/"             -> []
        var segments = path.split("/").filter(Boolean);
        var section = segments[0] || "";
        var itemId = segments[1] || "";

        var isProfile = section === "profile";
        var isLog = section === "log";
        var isSpot = section === "spot";

        if (!isProfile && !isLog && !isSpot) {
          window.location.replace("/");
          return;
        }

        // Region-neutral App Store link: Apple redirects to the user's storefront.
        var storeURL = "https://apps.apple.com/app/id6748411212";
        var title = document.getElementById("title");
        var subtitle = document.getElementById("subtitle");
        var debug = document.getElementById("debug");

        var customSchemeURL = "";
        var storeLink = document.getElementById("storeLink");
        if (storeLink) {
          storeLink.href = storeURL;
          storeLink.textContent = t.store;
        }

        // If there's no ID, we can't deep-link to a specific resource.
        // Guide the user to the App Store (with a visible fallback UI).
        if (!itemId) {
          title.textContent = t.noIdTitle;
          subtitle.textContent = t.noIdSub;
          debug.textContent = "";

          var cardNoId = document.getElementById("card");
          if (cardNoId) cardNoId.classList.add("visible");

          // Attempt to open the App Store directly (some in-app browsers may block redirects).
          setTimeout(function () {
            window.location.href = storeURL;
          }, 300);
          return;
        }

        customSchemeURL = "rilo://" + section + "/" + itemId;
        title.textContent = t.titles[section];
        debug.textContent = itemId ? (t.idLabels[section] + itemId) : "";

        subtitle.textContent = t.deepLinkSub;

        var card = document.getElementById("card");
        var appOpened = false;

        // Detect if app opened (page loses visibility)
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            appOpened = true;
          }
        });
        window.addEventListener("blur", function () {
          appOpened = true;
        });

        // Try Custom URL Scheme first (for in-app browsers like KakaoTalk)
        if (customSchemeURL) {
          window.location.href = customSchemeURL;
        }

        // Show card if app doesn't open (don't auto-redirect)
        setTimeout(function () {
          if (!appOpened && !document.hidden) {
            card.classList.add("visible");
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
