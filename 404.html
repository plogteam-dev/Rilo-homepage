<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RILO</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: #0b0b0b;
        color: #ffffff;
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
      }
      .title { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
      .sub { opacity: 0.8; margin: 0 0 16px; line-height: 1.4; }
      .btn {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 12px;
        background: #ffffff;
        color: #0b0b0b;
        text-decoration: none;
        font-weight: 700;
      }
      .muted { opacity: 0.6; margin-top: 12px; font-size: 13px; }
      .card { display: none; }
      .card.visible { display: block; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <p class="title" id="title">RILO로 이동 중…</p>
      <p class="sub" id="subtitle">앱이 설치되어 있으면 자동으로 앱에서 열려요.</p>
      <a class="btn" id="storeLink" href="https://apps.apple.com/kr/app/rilo/id6748411212">App Store에서 RILO 받기</a>
      <p class="muted" id="debug"></p>
    </div>

    <script>
      (function () {
        var path = window.location.pathname || "";
        // Normalize and parse path segments
        // Examples:
        // - "/profile/123"  -> ["profile","123"]
        // - "/profile/"     -> ["profile"]
        // - "/profile"      -> ["profile"]
        // - "/"             -> []
        var segments = path.split("/").filter(Boolean);
        var section = segments[0] || "";
        var itemId = segments[1] || "";

        var isProfile = section === "profile";
        var isLog = section === "log";
        var isSpot = section === "spot";

        if (!isProfile && !isLog && !isSpot) {
          window.location.replace("/");
          return;
        }

        var storeURL = "https://apps.apple.com/kr/app/rilo/id6748411212";
        var title = document.getElementById("title");
        var subtitle = document.getElementById("subtitle");
        var debug = document.getElementById("debug");

        var customSchemeURL = "";
        var storeLink = document.getElementById("storeLink");
        if (storeLink) storeLink.href = storeURL;

        // If there's no ID, we can't deep-link to a specific resource.
        // Guide the user to the App Store (with a visible fallback UI).
        if (!itemId) {
          title.textContent = "RILO 받기";
          subtitle.textContent = "앱을 설치하면 이 링크를 열 수 있어요. App Store로 이동합니다…";
          debug.textContent = "";

          var cardNoId = document.getElementById("card");
          if (cardNoId) cardNoId.classList.add("visible");

          // Attempt to open the App Store directly (some in-app browsers may block redirects).
          setTimeout(function () {
            window.location.href = storeURL;
          }, 300);
          return;
        }

        if (isProfile) {
          customSchemeURL = "rilo://profile/" + itemId;
          title.textContent = "RILO 프로필";
          debug.textContent = itemId ? ("프로필 ID: " + itemId) : "";
        } else if (isLog) {
          customSchemeURL = "rilo://log/" + itemId;
          title.textContent = "RILO 로그";
          debug.textContent = itemId ? ("로그 ID: " + itemId) : "";
        } else if (isSpot) {
          customSchemeURL = "rilo://spot/" + itemId;
          title.textContent = "RILO 스팟";
          debug.textContent = itemId ? ("스팟 ID: " + itemId) : "";
        }

        subtitle.textContent = "앱이 설치되어 있지 않다면 App Store에서 받을 수 있어요.";

        var card = document.getElementById("card");
        var appOpened = false;

        // Detect if app opened (page loses visibility)
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            appOpened = true;
          }
        });
        window.addEventListener("blur", function () {
          appOpened = true;
        });

        // Try Custom URL Scheme first (for in-app browsers like KakaoTalk)
        if (customSchemeURL) {
          window.location.href = customSchemeURL;
        }

        // Show card if app doesn't open (don't auto-redirect)
        setTimeout(function () {
          if (!appOpened && !document.hidden) {
            card.classList.add("visible");
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
